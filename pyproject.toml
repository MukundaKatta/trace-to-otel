[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-to-otel"
version = "0.1.0"
description = "Convert agent JSONL audit logs (agenttrace, agentleash, agentsnap, agent-step-log) into OTLP JSON spans you can POST to any OpenTelemetry collector. Zero deps."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mukunda Rao Katta", email = "mukunda.vjcs6@gmail.com" }]
keywords = ["agents", "audit", "observability", "otel", "opentelemetry", "otlp", "tracing", "jsonl", "gen-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/MukundaKatta/trace-to-otel"
Repository = "https://github.com/MukundaKatta/trace-to-otel"
Issues = "https://github.com/MukundaKatta/trace-to-otel/issues"

[project.scripts]
trace-to-otel = "trace_to_otel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trace_to_otel = ["py.typed"]
